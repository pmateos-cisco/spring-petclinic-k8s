---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: spring-petclinic
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: petclinic
    tier: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: customers
  namespace: spring-petclinic
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: petclinic
    tier: customers
---
# Debugging aids only: hit a specific version directly, bypassing the
# load-balanced `customers` Service above, e.g.:
#   kubectl -n spring-petclinic port-forward svc/customers-v2 8081:8080
apiVersion: v1
kind: Service
metadata:
  name: customers-v1
  namespace: spring-petclinic
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: petclinic
    tier: customers
    version: v1
---
apiVersion: v1
kind: Service
metadata:
  name: customers-v2
  namespace: spring-petclinic
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: petclinic
    tier: customers
    version: v2
---
apiVersion: v1
kind: Service
metadata:
  name: vets
  namespace: spring-petclinic
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: petclinic
    tier: vets
---
apiVersion: v1
kind: Service
metadata:
  name: visits
  namespace: spring-petclinic
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: petclinic
    tier: visits
